<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barista Recipe Guide - 100% Offline</title>
  <style>
    /* ==========================================================================
       PURE OFFLINE CSS SYSTEM - WARM ESPRESSO THEME & FLEXIBLE UTILITIES
       ========================================================================== */
    :root {
      /* Dark Theme Defaults (Warm Coffee & Espresso Palette) */
      --bg-main: #120d0b;
      --bg-surface: #1e1613;
      --bg-card: #261c18;
      --bg-card-hover: #31241f;
      --border-color: #3b2a24;
      --border-accent: #6d4233;
      
      --text-primary: #f3ece7;
      --text-secondary: #c4b0a4;
      --text-muted: #8c786c;
      
      --accent: #e07a5f;
      --accent-hover: #f28a6f;
      --accent-bg: rgba(224, 122, 95, 0.15);
      
      --tag-hot-bg: #4a2118;
      --tag-hot-text: #ff9d85;
      --tag-iced-bg: #1c3b4a;
      --tag-iced-text: #82d4f7;
      --tag-blended-bg: #3d2a4e;
      --tag-blended-text: #d8b4fe;

      --badge-code-bg: #33231a;
      --badge-code-text: #f4a261;

      --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;

      --transition-speed: 0.2s;
    }

    /* Light Theme Toggle Overrides */
    [data-theme="light"] {
      --bg-main: #f8f5f2;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f3ede7;
      --border-color: #e5dcd3;
      --border-accent: #d0bfae;
      
      --text-primary: #2b1e18;
      --text-secondary: #635147;
      --text-muted: #8d7a70;
      
      --accent: #d96b43;
      --accent-hover: #c25932;
      --accent-bg: rgba(217, 107, 67, 0.12);
      
      --tag-hot-bg: #ffebe6;
      --tag-hot-text: #c0392b;
      --tag-iced-bg: #e6f7ff;
      --tag-iced-text: #0077b6;
      --tag-blended-bg: #f3e8ff;
      --tag-blended-text: #7e22ce;

      --badge-code-bg: #f4ece4;
      --badge-code-text: #b85d19;

      --shadow: 0 4px 16px rgba(50, 30, 20, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    /* SVG Icon Sizing */
    .icon {
      width: 1.25rem;
      height: 1.25rem;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* App Header */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }

    .header-top {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      background: var(--accent);
      color: #fff;
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-toggle-btn {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all var(--transition-speed);
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Search & Barista Quick Controls */
    .controls-bar {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-box input {
      width: 100%;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      outline: none;
      transition: border-color var(--transition-speed);
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-icon-inside {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .clear-search-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: none;
    }

    .clear-search-btn.active {
      display: block;
    }

    /* Batch Multiplier Controls */
    .batch-control {
      display: flex;
      align-items: center;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.25rem;
      gap: 0.25rem;
    }

    .batch-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .batch-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition-speed);
    }

    .batch-btn.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    /* Horizontally Scrollable Category Nav Bar */
    .category-nav-wrapper {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-accent) transparent;
    }

    .category-nav-wrapper::-webkit-scrollbar {
      height: 5px;
    }

    .category-nav-wrapper::-webkit-scrollbar-thumb {
      background-color: var(--border-accent);
      border-radius: 4px;
    }

    .category-nav {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      white-space: nowrap;
    }

    .cat-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
      transition: all var(--transition-speed);
    }

    .cat-btn:hover {
      background: var(--bg-main);
      color: var(--text-primary);
    }

    .cat-btn.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .cat-badge {
      background: var(--bg-main);
      color: var(--text-muted);
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .cat-btn.active .cat-badge {
      background: var(--accent);
      color: #fff;
    }

    /* Main Container & Grid */
    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 640px) {
      .recipe-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .recipe-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1280px) {
      .recipe-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Recipe Card Styling */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      position: relative;
      transition: transform var(--transition-speed), border-color var(--transition-speed), background-color var(--transition-speed);
    }

    .card:hover {
      border-color: var(--border-accent);
      background-color: var(--bg-card-hover);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }

    .drink-title-group {
      display: flex;
      flex-direction: column;
    }

    .drink-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .drink-code-badge {
      display: inline-block;
      align-self: flex-start;
      background: var(--badge-code-bg);
      color: var(--badge-code-text);
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-sm);
      margin-top: 0.25rem;
      letter-spacing: 0.05em;
    }

    .card-actions {
      display: flex;
      gap: 0.25rem;
    }

    .pin-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.35rem;
      border-radius: 50%;
      transition: color var(--transition-speed);
    }

    .pin-btn:hover, .pin-btn.pinned {
      color: #f59e0b;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .tag-hot {
      background-color: var(--tag-hot-bg);
      color: var(--tag-hot-text);
    }

    .tag-iced {
      background-color: var(--tag-iced-bg);
      color: var(--tag-iced-text);
    }

    .tag-blended {
      background-color: var(--tag-blended-bg);
      color: var(--tag-blended-text);
    }

    /* Size Selector Switcher inside card */
    .size-selector {
      display: flex;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.2rem;
      gap: 0.2rem;
      margin-bottom: 1rem;
      overflow-x: auto;
    }

    .size-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.25rem;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all var(--transition-speed);
    }

    .size-btn.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    /* Ingredients List */
    .ingredients-box {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      flex: 1;
    }

    .ingredients-list {
      list-style: none;
      font-size: 0.875rem;
    }

    .ingredients-list li {
      padding: 0.25rem 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      color: var(--text-primary);
    }

    .ingredients-list li:last-child {
      border-bottom: none;
    }

    .ing-name {
      color: var(--text-secondary);
    }

    .ing-val {
      font-weight: 700;
      color: var(--accent);
    }

    .notes-box {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      background: rgba(0,0,0,0.1);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
    }

    /* Offline Banner / Status */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .empty-state svg {
      width: 3rem;
      height: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* Toast Notification for offline interactions */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--accent);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transform: translateY(150%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-size: 0.875rem;
      font-weight: 600;
    }

    .toast.show {
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background: var(--bg-surface);
      margin-top: auto;
    }
  </style>
</head>

    <!-- HORIZONTAL CATEGORY NAVIGATION BAR -->

    /* ==========================================================================
       APPLICATION STATE MANAGEMENT
       ========================================================================== */
    let activeCategory = "All";
    let activeSearchQuery = "";
    let currentMultiplier = 1;
    let selectedSizeIndices = {}; // Stores size choice per recipe ID
    let pinnedRecipeIds = [];

    // LocalStorage Keys
    const THEME_KEY = "barista_app_theme";
    const PINNED_KEY = "barista_app_pinned";

    /* ==========================================================================
       DOM ELEMENTS
       ========================================================================== */
    const recipeGrid = document.getElementById("recipeGrid");
    const categoryNav = document.getElementById("categoryNav");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const activeCategoryTitle = document.getElementById("activeCategoryTitle");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeLabel = document.getElementById("themeLabel");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");

    /* ==========================================================================
       INIT APP
       ========================================================================== */
    window.addEventListener("DOMContentLoaded", () => {
      initTheme();
      loadPinnedRecipes();
      renderCategoryNav();
      renderRecipes();
      setupEventListeners();
    });

    /* ==========================================================================
       THEME CONTROLLER
       ========================================================================== */
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
      themeLabel.textContent = savedTheme === "dark" ? "Dark" : "Light";
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const newTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem(THEME_KEY, newTheme);
      themeLabel.textContent = newTheme === "dark" ? "Dark" : "Light";
      showToast(`Switched to ${newTheme} theme`);
    }

    /* ==========================================================================
       PINNED / FAVORITES MANAGEMENT
       ========================================================================== */
    function loadPinnedRecipes() {
      try {
        const saved = localStorage.getItem(PINNED_KEY);
        pinnedRecipeIds = saved ? JSON.parse(saved) : [];
      } catch (e) {
        pinnedRecipeIds = [];
      }
    }

    function togglePin(recipeId) {
      if (pinnedRecipeIds.includes(recipeId)) {
        pinnedRecipeIds = pinnedRecipeIds.filter(id => id !== recipeId);
        showToast("Removed from favorites");
      } else {
        pinnedRecipeIds.push(recipeId);
        showToast("Pinned to favorites");
      }
      localStorage.setItem(PINNED_KEY, JSON.stringify(pinnedRecipeIds));
      renderCategoryNav();
      renderRecipes();
    }

    /* ==========================================================================
       CATEGORY NAVIGATION
       ========================================================================== */
    function getCategories() {
      const categories = ["All", "Favorites"];
      RECIPE_DATA.forEach(r => {
        if (!categories.includes(r.category)) {
          categories.push(r.category);
        }
      });
      return categories;
    }

    function renderCategoryNav() {
      const categories = getCategories();
      categoryNav.innerHTML = "";

      categories.forEach(cat => {
        let count = 0;
        if (cat === "All") count = RECIPE_DATA.length;
        else if (cat === "Favorites") count = pinnedRecipeIds.length;
        else count = RECIPE_DATA.filter(r => r.category === cat).length;

        const btn = document.createElement("button");
        btn.className = `cat-btn ${activeCategory === cat ? "active" : ""}`;
        btn.innerHTML = `${cat} <span class="cat-badge">${count}</span>`;
        btn.addEventListener("click", () => {
          activeCategory = cat;
          activeCategoryTitle.textContent = cat === "Favorites" ? "Pinned Recipes" : (cat === "All" ? "All Recipes" : cat);
          renderCategoryNav();
          renderRecipes();
        });

        categoryNav.appendChild(btn);
      });
    }

    /* ==========================================================================
       RECIPE CARD RENDER ENGINE
       ========================================================================== */
    function filterRecipes() {
      return RECIPE_DATA.filter(recipe => {
        // Category Filter
        if (activeCategory === "Favorites") {
          if (!pinnedRecipeIds.includes(recipe.id)) return false;
        } else if (activeCategory !== "All" && recipe.category !== activeCategory) {
          return false;
        }

        // Search Filter (Name, Drink Code, Variants)
        if (activeSearchQuery.trim() !== "") {
          const query = activeSearchQuery.toLowerCase();
          const matchName = recipe.name.toLowerCase().includes(query);
          const matchCode = recipe.code.toLowerCase().includes(query);
          const matchVar = recipe.variants ? recipe.variants.toLowerCase().includes(query) : false;
          return matchName || matchCode || matchVar;
        }

        return true;
      });
    }

    function renderRecipes() {
      const filtered = filterRecipes();
      recipeGrid.innerHTML = "";

      if (filtered.length === 0) {
        recipeGrid.innerHTML = `
          <div class="empty-state">
            <svg class="icon" viewBox="0 0 24 24"><path d="M11,15H13V17H11V15M11,7H13V13H11V7M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z"/></svg>
            <p>No barista recipes found matching your criteria.</p>
          </div>
        `;
        return;
      }

      // Sort Pinned to top if viewing All or Specific Category
      const sorted = [...filtered].sort((a, b) => {
        const aPinned = pinnedRecipeIds.includes(a.id);
        const bPinned = pinnedRecipeIds.includes(b.id);
        if (aPinned && !bPinned) return -1;
        if (!aPinned && bPinned) return 1;
        return 0;
      });

      sorted.forEach(recipe => {
        const isPinned = pinnedRecipeIds.includes(recipe.id);
        const activeSizeIdx = selectedSizeIndices[recipe.id] !== undefined ? selectedSizeIndices[recipe.id] : 0;
        const currentSizeObj = recipe.sizes[activeSizeIdx] || recipe.sizes[0];

        const card = document.createElement("div");
        card.className = "card";

        // Tags HTML
        const tagsHtml = recipe.tags.map(t => {
          let tagClass = "tag-iced";
          if (t.toLowerCase() === "hot") tagClass = "tag-hot";
          if (t.toLowerCase() === "blended") tagClass = "tag-blended";
          return `<span class="tag ${tagClass}">${t}</span>`;
        }).join("");

        // Size Selector Buttons HTML
        const sizesHtml = recipe.sizes.map((sz, idx) => `
          <button class="size-btn ${idx === activeSizeIdx ? 'active' : ''}" data-recipe-id="${recipe.id}" data-size-idx="${idx}">
            ${sz.name}
          </button>
        `).join("");

        // Ingredients Items HTML
        const ingredientsHtml = currentSizeObj.items.map(item => {
          let displayVal = item.qty;
          if (!item.isText && typeof item.qty === 'number') {
            const calculated = item.qty * currentMultiplier;
            // Handle decimal precision cleanly
            const formatted = Number.isInteger(calculated) ? calculated : calculated.toFixed(1);
            displayVal = `${formatted}${item.unit ? ' ' + item.unit : ''}`;
          }
          return `
            <li>
              <span class="ing-name">${item.ing}</span>
              <span class="ing-val">${displayVal}</span>
            </li>
          `;
        }).join("");

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="drink-title-group">
                <span class="drink-title">${recipe.name}</span>
                <span class="drink-code-badge">${recipe.code}</span>
              </div>
              <div class="card-actions">
                <button class="pin-btn ${isPinned ? 'pinned' : ''}" title="Pin/Favorite Recipe" data-pin-id="${recipe.id}">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M16,12V4H17V2H7V4H8V12L6,14V16H11.5V22H12.5V16H18V14L16,12Z"/></svg>
                </button>
              </div>
            </div>

            <div class="tag-container">
              ${tagsHtml}
            </div>

            <div class="size-selector">
              ${sizesHtml}
            </div>

            <div class="ingredients-box">
              <ul class="ingredients-list">
                ${ingredientsHtml}
              </ul>
            </div>
          </div>

          ${recipe.note ? `<div class="notes-box">💡 ${recipe.note}</div>` : ''}
        `;

        recipeGrid.appendChild(card);
      });

      attachCardEventListeners();
    }

    /* ==========================================================================
       EVENT LISTENERS & DELEGATION
       ========================================================================== */
    function attachCardEventListeners() {
      // Pin / Favorite Buttons
      document.querySelectorAll(".pin-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-pin-id");
          togglePin(id);
        });
      });

      // Size Switching Buttons
      document.querySelectorAll(".size-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const recipeId = btn.getAttribute("data-recipe-id");
          const sizeIdx = parseInt(btn.getAttribute("data-size-idx"), 10);
          selectedSizeIndices[recipeId] = sizeIdx;
          renderRecipes();
        });
      });
    }

    function setupEventListeners() {
      // Search Input
      searchInput.addEventListener("input", (e) => {
        activeSearchQuery = e.target.value;
        if (activeSearchQuery.length > 0) {
          clearSearchBtn.classList.add("active");
        } else {
          clearSearchBtn.classList.remove("active");
        }
        renderRecipes();
      });

      clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        activeSearchQuery = "";
        clearSearchBtn.classList.remove("active");
        renderRecipes();
      });

      // Batch Multiplier Buttons
      document.querySelectorAll(".batch-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".batch-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentMultiplier = parseInt(btn.getAttribute("data-multiplier"), 10);
          showToast(`Batch multiplier set to x${currentMultiplier}`);
          renderRecipes();
        });
      });

      // Theme Toggle
      themeToggleBtn.addEventListener("click", toggleTheme);
    }

    /* ==========================================================================
       UTILITIES & TOAST NOTIFICATION
       ========================================================================== */
    let toastTimeout;
